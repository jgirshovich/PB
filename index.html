<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>St. Anne Photo Booth</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
    }

    /* Start Screen Container */
    #start-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
      user-select: none;
    }

    /* Logo Styling */
    .logo {
      width: 160px;
      height: auto;
      max-width: 80vw;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      margin-bottom: 20px;
    }

    .logo:active {
      transform: scale(0.95);
      opacity: 0.8;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .instruction {
      margin-bottom: 25px;
      font-size: 0.95rem;
      color: #a0a0a0;
    }

    .btn-container {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .start-btn {
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .start-btn:active {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

    <h1>St. Anne Photo Booth</h1>
    <p class="instruction">Tap the logo to toggle full-screen mode</p>

    <div class="btn-container">
      <button class="start-btn" onclick="alert('Student mode started!')">Student Start</button>
      <button class="start-btn" style="background-color: #28a745;" onclick="alert('Staff mode started!')">Staff Start</button>
    </div>
  </div>

  <script>
    const logo = document.getElementById('app-logo');

    logo.addEventListener('click', () => {
      toggleFullscreen();
    });

    function toggleFullscreen() {
      const fullScreenElement = 
        document.fullscreenElement || 
        document.webkitFullscreenElement || 
        document.mozFullScreenElement || 
        document.msFullscreenElement;

      if (!fullScreenElement) {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen();
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        } else if (docEl.mozRequestFullScreen) {
          docEl.mozRequestFullScreen();
        } else if (docEl.msRequestFullscreen) {
          docEl.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.mozCancelFullScreen) {
          document.mozCancelFullScreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
