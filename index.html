<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }

    .logo-container {
      cursor: pointer;
      margin-bottom: 20px;
    }

    .logo-container img {
      max-width: 150px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .button-group {
      margin-top: 25px;
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-student { background-color: #007bff; }
    .btn-staff { background-color: #28a745; }
    .btn:hover { opacity: 0.9; }

    /* Views */
    .view { display: none; }
    .view.active { display: block; }
  </style>
</head>
<body>

  <!-- START SCREEN VIEW -->
  <div id="startView" class="view active">
    <div class="logo-container" onclick="toggleFullScreen()" title="Click to toggle full screen">
      <!-- Direct image src link or base64 data link here -->
      <img src="YOUR_LOGO_URL_HERE" alt="St. Anne Logo" onerror="this.style.display='none';">
    </div>

    <h1>St. Anne Photo Booth</h1>
    <p style="color: #aaa; font-size: 14px;">Tap the logo to toggle full-screen mode</p>

    <div class="button-group">
      <button class="btn btn-student" onclick="startMode('student')">Student Start</button>
      <button class="btn btn-staff" onclick="startMode('staff')">Staff Start</button>
    </div>
  </div>

  <!-- SELECTION / CAMERA VIEW (Restored Functional View) -->
  <div id="mainView" class="view">
    <h2 id="modeTitle"></h2>
    <!-- Insert camera feed or selection workflow content here -->
    <button class="btn btn-student" onclick="resetApp()">Back to Start</button>
  </div>

  <script>
    // Screen Switcher Logic
    function startMode(mode) {
      document.getElementById('startView').classList.remove('active');
      document.getElementById('mainView').classList.add('active');
      
      const title = mode === 'student' ? 'Student Mode' : 'Staff Mode';
      document.getElementById('modeTitle').innerText = title;

      // Call your app initiation function here (e.g., loading student roster/camera setup)
      if (typeof initCamera === 'function') {
        initCamera(mode);
      }
    }

    function resetApp() {
      document.getElementById('mainView').classList.remove('active');
      document.getElementById('startView').classList.add('active');
    }

    // Safe Full-Screen Toggle
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn("Full-screen request failed: ", err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
