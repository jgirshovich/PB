<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App with Fullscreen Logo Toggle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
    }

    /* Start Screen Layout */
    #start-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      user-select: none;
    }

    /* Logo Styling */
    .logo {
      width: 150px;
      height: auto;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .logo:active {
      transform: scale(0.95);
      opacity: 0.8;
    }

    .instruction {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #a0a0a0;
    }

    /* Additional UI controls */
    .start-btn {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .start-btn:active {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div id="start-screen">
    <!-- Clickable/Tappable Logo -->
    <img 
      id="app-logo" 
      class="logo" 
      src="https://via.placeholder.com/150/007bff/ffffff?text=LOGO" 
      alt="App Logo"
    />
    <p class="instruction">Tap logo to toggle Fullscreen</p>

    <button class="start-btn" onclick="alert('App Started!')">Start</button>
  </div>

  <script>
    const logo = document.getElementById('app-logo');

    logo.addEventListener('click', () => {
      toggleFullscreen();
    });

    function toggleFullscreen() {
      // Check if full screen is currently active across different browser implementations
      const fullScreenElement = 
        document.fullscreenElement || 
        document.webkitFullscreenElement || 
        document.mozFullScreenElement || 
        document.msFullscreenElement;

      if (!fullScreenElement) {
        // Enter Fullscreen
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen();
        } else if (docEl.webkitRequestFullscreen) { /* Safari / Older Chrome */
          docEl.webkitRequestFullscreen();
        } else if (docEl.mozRequestFullScreen) { /* Firefox */
          docEl.mozRequestFullScreen();
        } else if (docEl.msRequestFullscreen) { /* IE/Edge */
          docEl.msRequestFullscreen();
        }
      } else {
        // Exit Fullscreen
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) { /* Safari */
          document.webkitExitFullscreen();
        } else if (document.mozCancelFullScreen) { /* Firefox */
          document.mozCancelFullScreen();
        } else if (document.msExitFullscreen) { /* IE/Edge */
          document.msExitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
